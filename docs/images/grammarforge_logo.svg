<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="forge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="spark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="20" y="20" width="360" height="360" rx="80" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="3" />

  <!-- Grid Accents -->
  <circle cx="200" cy="200" r="130" stroke="rgba(56, 189, 248, 0.08)" stroke-width="2" fill="none" stroke-dasharray="6,6" />
  <circle cx="200" cy="200" r="80" stroke="rgba(99, 102, 241, 0.12)" stroke-width="2" fill="none" />

  <!-- Anvil Base / Forge Body -->
  <path d="M120 280 L280 280 L260 250 L230 250 L230 210 L270 190 L270 170 L130 170 L130 190 L170 210 L170 250 L140 250 Z" 
        fill="url(#forge-grad)" opacity="0.9" filter="url(#glow)" />

  <!-- Code / Grammar BNF Brackets [ { :: } ] -->
  <!-- Left Bracket -->
  <path d="M110 130 L85 130 L85 230 L110 230" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Right Bracket -->
  <path d="M290 130 L315 130 L315 230 L290 230" fill="none" stroke="#6366f1" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Center Sparks: BNF ::= Symbol & Spark -->
  <circle cx="170" cy="140" r="7" fill="url(#spark-grad)" filter="url(#glow)" />
  <circle cx="230" cy="140" r="7" fill="url(#spark-grad)" filter="url(#glow)" />
  <circle cx="200" cy="115" r="9" fill="#38bdf8" filter="url(#glow)" />

  <!-- Hammer / Beam Strike -->
  <polygon points="200,70 212,100 188,100" fill="#38bdf8" />

  <!-- Text / Typography -->
  <text x="200" y="330" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#f8fafc" letter-spacing="4">
    GRAMMARFORGE
  </text>
  <text x="200" y="352" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="2">
    CONSTRAINED DECODING
  </text>
</svg>
