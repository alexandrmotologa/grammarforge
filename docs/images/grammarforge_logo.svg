<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="squircle-clip">
      <rect x="24" y="24" width="976" height="976" rx="220" />
    </clipPath>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="core-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="amber-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <linearGradient id="armor-hi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <linearGradient id="armor-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <linearGradient id="armor-mid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="armor-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="beak-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- 1. Luxury White Squircle Container -->
  <rect x="24" y="24" width="976" height="976" rx="220" fill="#ffffff" stroke="#e2e8f0" stroke-width="6" />

  <g clip-path="url(#squircle-clip)">
    <g transform="translate(512, 512)" filter="url(#subtle-shadow)">

      <!-- 2. Massive Hexagonal Architectural Gateway Frame -->
      <polygon points="
        0,-390
        338,-195
        338,195
        0,390
        -338,195
        -338,-195
      " fill="none" stroke="#0f172a" stroke-width="40" stroke-linejoin="round" />

      <polygon points="
        0,-355
        307,-177
        307,177
        0,355
        -307,177
        -307,-177
      " fill="none" stroke="#00f5ff" stroke-width="4" opacity="0.45" stroke-dasharray="16, 12" />

      <!-- Gateway Corner Telemetry Lines -->
      <line x1="-338" y1="-195" x2="-307" y2="-177" stroke="#00f5ff" stroke-width="4" opacity="0.7" />
      <line x1="338" y1="-195" x2="307" y2="-177" stroke="#00f5ff" stroke-width="4" opacity="0.7" />
      <line x1="-338" y1="195" x2="-307" y2="177" stroke="#00f5ff" stroke-width="4" opacity="0.7" />
      <line x1="338" y1="195" x2="307" y2="177" stroke="#00f5ff" stroke-width="4" opacity="0.7" />
      <line x1="0" y1="-390" x2="0" y2="-355" stroke="#00f5ff" stroke-width="4" opacity="0.7" />
      <line x1="0" y1="390" x2="0" y2="355" stroke="#00f5ff" stroke-width="4" opacity="0.7" />

      <!-- 3. THE SENTINEL FALCON (Aerodynamic Raptor & Constrained Logit Engine) -->

      <!-- Solid Watertight Base Silhouette -->
      <path d="
        M 0,-310
        L 95,-275 L 180,-215 L 255,-130 L 275,-25 L 240,90 L 190,195 L 115,295 L 0,355
        L -115,295 L -190,195 L -240,90 L -275,-25 L -255,-130 L -180,-215 L -95,-275
        Z"
        fill="#0b0f19"
      />

      <!-- FALCON CROWN & STREAMLINED CRANIAL KEEL -->
      <!-- Center Forehead Keel (Streamlined, sloping backwards like a diving raptor) -->
      <polygon points="0,-310 45,-240 0,-170 -45,-240" fill="url(#armor-hi)" />
      <!-- Left Crown Plate -->
      <polygon points="0,-310 -45,-240 -115,-235 -95,-275" fill="url(#armor-light)" />
      <!-- Right Crown Plate (Illuminated) -->
      <polygon points="0,-310 95,-275 115,-235 45,-240" fill="url(#armor-hi)" />

      <!-- Back Crown Shoulders (Nuchal crest) -->
      <polygon points="-95,-275 -180,-215 -145,-195 -115,-235" fill="url(#armor-dark)" />
      <polygon points="95,-275 115,-235 145,-195 180,-215" fill="url(#armor-mid)" />

      <!-- SUPRAORBITAL BROW (Sharp Predatory Angle) -->
      <!-- Left Brow -->
      <polygon points="-45,-240 -115,-235 -130,-175 -50,-170" fill="url(#armor-dark)" />
      <!-- Right Brow -->
      <polygon points="45,-240 50,-170 130,-175 115,-235" fill="url(#armor-light)" />

      <!-- EYES: Authentic predatory almond shape slanted upward, surrounded by dark shadow socket -->
      <!-- Left Eye Orbit -->
      <polygon points="-125,-170 -50,-165 -100,-135" fill="#030712" />
      <polygon points="-118,-164 -60,-161 -95,-142" fill="url(#cyan-glow)" />
      <circle cx="-90" cy="-153" r="3" fill="#ffffff" />

      <!-- Right Eye Orbit -->
      <polygon points="125,-170 100,-135 50,-165" fill="#030712" />
      <polygon points="118,-164 95,-142 60,-161" fill="url(#cyan-glow)" />
      <circle cx="90" cy="-153" r="3" fill="#ffffff" />

      <!-- PEREGRINE MALAR STRIPES (Integrated Low-Poly Facets, NOT drawn as lines/hoses) -->
      <polygon points="-130,-175 -100,-135 -140,-75 -180,-125" fill="url(#armor-dark)" />
      <polygon points="130,-175 180,-125 140,-75 100,-135" fill="url(#armor-mid)" />

      <!-- FALCON PROMINENT HOOKED BEAK (Anatomically True Raptor Beak) -->
      <!-- Upper Beak Base / Cere -->
      <polygon points="0,-170 45,-150 0,-115 -45,-150" fill="url(#armor-hi)" />
      <!-- Beak Left Ridge -->
      <polygon points="-45,-150 0,-115 -35,-55" fill="url(#armor-mid)" />
      <!-- Beak Right Ridge (Lit) -->
      <polygon points="45,-150 35,-55 0,-115" fill="url(#armor-light)" />
      <!-- Curved Raptorial Hook / Tooth (The Precision Constrained Diver) -->
      <polygon points="0,-115 35,-55 0,10 -35,-55" fill="url(#cyan-glow)" />
      <!-- Sharp Cutting Edge Specular Highlight -->
      <polygon points="0,-85 14,-50 0,10 -14,-50" fill="#e0f2fe" opacity="0.9" />

      <!-- CHEEKS & JUGULAR CONVERGENCE -->
      <polygon points="-100,-135 -35,-55 -85,-15 -140,-75" fill="url(#armor-dark)" />
      <polygon points="100,-135 140,-75 85,-15 35,-55" fill="url(#armor-mid)" />
      <polygon points="-35,-55 0,10 -20,65 -85,-15" fill="url(#armor-dark)" />
      <polygon points="35,-55 85,-15 20,65 0,10" fill="url(#armor-light)" />

      <!-- MASSIVE FOLDED DIVER WINGS (Structural Conformance Plates) -->
      <!-- Outer Wing Blade 1 (Top Tip) -->
      <polygon points="-180,-215 -255,-130 -210,-70 -145,-195" fill="url(#armor-dark)" />
      <polygon points="180,-215 145,-195 210,-70 255,-130" fill="url(#armor-light)" />

      <!-- Outer Wing Blade 2 (Mid Flange) -->
      <polygon points="-255,-130 -275,-25 -205,20 -210,-70" fill="url(#armor-dark)" />
      <polygon points="255,-130 210,-70 205,20 275,-25" fill="url(#armor-hi)" />

      <!-- Outer Wing Blade 3 (Lower Scythe) -->
      <polygon points="-275,-25 -240,90 -170,95 -205,20" fill="url(#armor-mid)" />
      <polygon points="275,-25 205,20 170,95 240,90" fill="url(#armor-light)" />

      <!-- Inner Primary Blade Left -->
      <polygon points="-210,-70 -140,-75 -155,25 -205,20" fill="url(#armor-dark)" />
      <polygon points="-140,-75 -85,-15 -115,75 -155,25" fill="url(#armor-mid)" />
      <polygon points="-205,20 -155,25 -170,95" fill="url(#armor-dark)" />

      <!-- Inner Primary Blade Right -->
      <polygon points="210,-70 205,20 155,25 140,-75" fill="url(#armor-light)" />
      <polygon points="140,-75 155,25 115,75 85,-15" fill="url(#armor-hi)" />
      <polygon points="205,20 170,95 155,25" fill="url(#armor-mid)" />

      <!-- Lower Wing Feathers Left -->
      <polygon points="-240,90 -190,195 -125,185 -170,95" fill="url(#armor-dark)" />
      <polygon points="-190,195 -115,295 -75,235 -125,185" fill="url(#armor-mid)" />

      <!-- Lower Wing Feathers Right -->
      <polygon points="240,90 170,95 125,185 190,195" fill="url(#armor-light)" />
      <polygon points="190,195 125,185 75,235 115,295" fill="url(#armor-hi)" />

      <!-- PECTORAL SHIELD & GRAMMAR GATEWAY CORE -->
      <!-- Center Chest Armor Plates -->
      <polygon points="-85,-15 0,10 -20,65 -85,60" fill="url(#armor-dark)" />
      <polygon points="85,-15 85,60 20,65 0,10" fill="url(#armor-mid)" />
      <polygon points="-85,60 -20,65 -45,145 -115,75" fill="url(#armor-dark)" />
      <polygon points="85,60 115,75 45,145 20,65" fill="url(#armor-light)" />

      <!-- CENTRAL CONSTRAINED ENGINE NODE (The Hexagonal Logit Reactor) -->
      <!-- Housing Bezel -->
      <polygon points="0,75 52,105 52,165 0,195 -52,165 -52,105" fill="#030712" stroke="#334155" stroke-width="4" stroke-linejoin="round" />
      <!-- Radiant Cyan Core -->
      <polygon points="0,87 42,111 42,159 0,183 -42,159 -42,111" fill="url(#cyan-glow)" />
      <!-- Inner Specular Aperture -->
      <polygon points="0,99 28,115 28,149 0,165 -28,149 -28,115" fill="#ffffff" opacity="0.85" />
      <circle cx="0" cy="132" r="8" fill="#00f5ff" />

      <!-- VENTRAL KEEL & TAIL VECTOR VANES -->
      <polygon points="-45,145 0,195 -75,235 -125,185" fill="url(#armor-dark)" />
      <polygon points="45,145 125,185 75,235 0,195" fill="url(#armor-light)" />
      <polygon points="0,195 0,305 -75,235" fill="url(#armor-dark)" />
      <polygon points="0,195 75,235 0,305" fill="url(#armor-mid)" />
      <polygon points="0,305 -75,235 -115,295 0,355" fill="url(#armor-dark)" />
      <polygon points="0,305 0,355 115,295 75,235" fill="url(#armor-light)" />

      <!-- Telemetry Vector Pointers on Wingtips & Tail (Subtle Microsecond Guidepoints) -->
      <circle cx="0" cy="355" r="4" fill="url(#amber-accent)" />
      <circle cx="-115" cy="295" r="3.5" fill="#00f5ff" opacity="0.85" />
      <circle cx="115" cy="295" r="3.5" fill="#00f5ff" opacity="0.85" />

    </g>
  </g>
</svg>
